<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Top red dome gradient -->
    <linearGradient id="topDome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3B56"/>
      <stop offset="100%" stop-color="#DC0A2D"/>
    </linearGradient>
    <!-- Bottom white dome gradient -->
    <linearGradient id="bottomDome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <!-- Center button gradient -->
    <radialGradient id="centerButton" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </radialGradient>
    <!-- Specular highlight for top dome -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Outer Black Bezel -->
  <circle cx="50" cy="50" r="48" fill="#18181B" stroke="#09090B" stroke-width="2"/>

  <!-- Top Red Half -->
  <path d="M 6 50 A 44 44 0 0 1 94 50 Z" fill="url(#topDome)"/>

  <!-- Top Gloss Highlight -->
  <path d="M 12 47 A 38 38 0 0 1 88 47 A 38 20 0 0 0 12 47 Z" fill="url(#gloss)"/>

  <!-- Bottom White Half -->
  <path d="M 6 50 A 44 44 0 0 0 94 50 Z" fill="url(#bottomDome)"/>

  <!-- Middle Dividing Line -->
  <rect x="4" y="46" width="92" height="8" fill="#18181B"/>

  <!-- Center Outer Ring -->
  <circle cx="50" cy="50" r="16" fill="#18181B"/>

  <!-- Center Middle Ring -->
  <circle cx="50" cy="50" r="12" fill="#E2E8F0"/>

  <!-- Center Inner Button -->
  <circle cx="50" cy="50" r="9" fill="url(#centerButton)" stroke="#94A3B8" stroke-width="1"/>

  <!-- Inner Button Specular Reflection -->
  <circle cx="47" cy="47" r="3" fill="#FFFFFF" opacity="0.9"/>
</svg>
